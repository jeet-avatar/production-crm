<!doctype html>
<!-- TCP v6 scene 2a - Body beat 1: "What you do" (10s) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>TCP v6 / __COMPANYNAME__ / what you do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; }
  body {
    background: #F8FAFC;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #0F172A;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .frame {
    width:1080px; height:1080px;
    background: #F8FAFC;
    padding: 96px 88px;
    display:flex; flex-direction:column;
    position: relative;
  }
  .topbar { display:flex; align-items:center; gap:18px; }
  .tcp-mark { height:36px; width:36px; background: linear-gradient(135deg,#F97316,#FB923C); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; color:#FFF; }
  .tcp-text { font-size:17px; font-weight:700; color:#0F172A; }
  .progress {
    display:flex; gap:8px; margin-top: 36px; margin-bottom: 56px;
  }
  .dot { width:10px; height:10px; border-radius:50%; background:#CBD5E1; }
  .dot.on { background:#F97316; transform: scale(1.2); }
  .kicker {
    font-size:14px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    color: #F97316; margin-bottom: 20px;
  }
  .headline {
    font-size: 64px; font-weight: 800; line-height: 1.1;
    letter-spacing: -0.03em; color: #0F172A; margin-bottom: 36px;
    max-width: 880px;
  }
  .card {
    margin-top: 8px;
    background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px;
    padding: 32px 36px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
    max-width: 880px;
  }
  .card .label { font-size:12px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#94A3B8; margin-bottom:14px; }
  .card .industry { font-size: 28px; font-weight: 700; color: #0F172A; line-height: 1.35; letter-spacing: -0.015em; }

  .footer { position:absolute; left:88px; right:88px; bottom:88px; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#94A3B8; }
  .footer .company { font-weight:700; color:#475569; }
</style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div class="tcp-mark">T</div>
      <div class="tcp-text">TechCloudPro</div>
    </div>

    <div class="progress">
      <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="kicker">What you do</div>
    <div class="headline">__COMPANYNAME__ — your space, in one line.</div>

    <div class="card">
      <div class="label">Industry</div>
      <div class="industry">__INDUSTRY__</div>
    </div>

    <div class="footer">
      <div class="company">__COMPANYNAME__</div>
      <div>1 of 4</div>
    </div>
  </div>
</body>
</html>
