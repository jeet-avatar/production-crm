<!doctype html>
<!-- TCP v6 scene 2c - Body beat 3: "Where we plug in" (10s) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>TCP v6 / __COMPANYNAME__ / where we plug in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; }
  body {
    background: #F8FAFC;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #0F172A;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .frame {
    width:1080px; height:1080px;
    background: #F8FAFC;
    padding: 96px 88px;
    display:flex; flex-direction:column;
    position: relative;
  }
  .topbar { display:flex; align-items:center; gap:18px; }
  .tcp-mark { height:36px; width:36px; background: linear-gradient(135deg,#F97316,#FB923C); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; color:#FFF; }
  .tcp-text { font-size:17px; font-weight:700; color:#0F172A; }
  .progress { display:flex; gap:8px; margin-top: 36px; margin-bottom: 48px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#CBD5E1; }
  .dot.on { background:#F97316; transform: scale(1.2); }
  .kicker {
    font-size:14px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    color: #F97316; margin-bottom: 20px;
  }
  .headline {
    font-size: 56px; font-weight: 800; line-height: 1.1;
    letter-spacing: -0.025em; color: #0F172A; margin-bottom: 36px;
    max-width: 880px;
  }
  .stack { display:flex; flex-direction:column; gap:18px; max-width: 880px; }
  .row {
    display:flex; gap:20px; align-items:flex-start;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-left: 4px solid #10B981;
    border-radius: 14px;
    padding: 22px 26px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  .row .check {
    flex-shrink:0;
    width: 36px; height: 36px;
    background: #ECFDF5;
    color: #047857;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size: 20px; font-weight: 800;
  }
  .row .fit { font-size: 22px; line-height: 1.4; color: #1E293B; font-weight: 500; letter-spacing: -0.01em; }

  .footer { position:absolute; left:88px; right:88px; bottom:88px; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#94A3B8; }
  .footer .company { font-weight:700; color:#475569; }
</style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div class="tcp-mark">T</div>
      <div class="tcp-text">TechCloudPro</div>
    </div>

    <div class="progress">
      <div class="dot"></div><div class="dot"></div><div class="dot on"></div><div class="dot"></div>
    </div>

    <div class="kicker">Where we plug in</div>
    <div class="headline">What TCP brings to __COMPANYNAME__.</div>

    <div class="stack">
      <div class="row"><div class="check">&check;</div><div class="fit">__TCPFIT1__</div></div>
      <div class="row"><div class="check">&check;</div><div class="fit">__TCPFIT2__</div></div>
      <div class="row"><div class="check">&check;</div><div class="fit">__TCPFIT3__</div></div>
    </div>

    <div class="footer">
      <div class="company">__COMPANYNAME__</div>
      <div>3 of 4</div>
    </div>
  </div>
</body>
</html>
