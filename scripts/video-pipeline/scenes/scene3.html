<!doctype html>
<!-- TCP v6 scene 3 - TCP Closer (7s)
     Placeholders: __FIRSTNAME__, __COMPANYNAME__
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>TCP v6 / Closer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; }
  body {
    background: #0F172A;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #F8FAFC;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .frame {
    width:1080px; height:1080px;
    background:
      radial-gradient(ellipse at top right, rgba(249,115,22,0.16), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(249,115,22,0.06), transparent 50%),
      #0F172A;
    padding: 96px 88px;
    display:flex; flex-direction:column;
    position: relative;
  }
  .topbar { display:flex; align-items:center; gap:18px; }
  .tcp-mark { height:36px; width:36px; background: linear-gradient(135deg,#F97316,#FB923C); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; color:#FFF; }
  .tcp-text { font-size:17px; font-weight:700; color:#F8FAFC; }
  .body { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .kicker { font-size:14px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#F97316; margin-bottom:24px; }
  .ask {
    font-size: 64px; font-weight: 800; line-height: 1.1;
    letter-spacing: -0.025em; color: #F8FAFC; margin-bottom: 16px;
  }
  .ask .accent { color: #F97316; }
  .sub {
    font-size: 22px; color: #94A3B8; line-height: 1.5; max-width: 800px;
    margin-bottom: 48px;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, #F97316, #FB923C);
    color: #FFF;
    font-size: 22px; font-weight: 700;
    padding: 22px 36px; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(249,115,22,0.35);
    width: fit-content;
    letter-spacing: -0.01em;
  }
  .cta .arrow { font-size: 26px; }
  .contact-strip {
    margin-top: 56px;
    display:flex; gap: 24px; flex-wrap: wrap;
    font-size: 16px; color: #CBD5E1;
  }
  .contact-strip .pill {
    background: rgba(248,250,252,0.06);
    border: 1px solid rgba(248,250,252,0.12);
    border-radius: 999px;
    padding: 10px 18px;
    font-weight: 500;
  }
  .footer-band {
    position:absolute; left:88px; right:88px; bottom:88px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color: #64748B;
    border-top: 1px solid rgba(248,250,252,0.08);
    padding-top: 20px;
  }
  .footer-band .left { display:flex; gap:18px; align-items:center; }
  .from-tag { font-size: 13px; font-weight: 600; color: #94A3B8; }
</style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div class="tcp-mark">T</div>
      <div class="tcp-text">TechCloudPro</div>
    </div>

    <div class="body">
      <div class="kicker">For __FIRSTNAME__ at __COMPANYNAME__</div>
      <div class="ask">
        Want a deeper read?<br>
        <span class="accent">Reply to this email.</span>
      </div>
      <div class="sub">
        Or skim the full page at <strong style="color:#F97316">__WATCHURL_DISPLAY__</strong>
      </div>

      <div class="cta">
        Schedule a call &middot; Talk to Sara <span class="arrow">&rarr;</span>
      </div>

      <div class="contact-strip">
        <div class="pill">sara@techcloudpro.com</div>
        <div class="pill">techcloudpro.com</div>
        <div class="pill">artha.build</div>
      </div>
    </div>

    <div class="footer-band">
      <div class="left">
        <div class="from-tag">TechCloudPro &middot; NetSuite + AI partner since 2015</div>
      </div>
      <div class="from-tag">Sara &middot; TechCloudPro</div>
    </div>
  </div>
</body>
</html>
